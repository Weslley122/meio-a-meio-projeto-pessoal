# ===== Perfil de produção =====
# Ative com: SPRING_PROFILES_ACTIVE=prod
# Todo segredo vem de variável de ambiente e NÃO tem valor padrão: se faltar um, a API nem sobe
# (falhar na subida é melhor do que rodar em produção com a chave de desenvolvimento do GitHub).

app.jwt.secret=${JWT_SECRET}
app.cripto.chave=${APP_CRIPTO_CHAVE}
app.admin.senha=${ADMIN_SENHA}
app.cors.allowed-origin=${CORS_ORIGIN}

# Banco: um usuário só com permissão de ler e gravar dados (SELECT, INSERT, UPDATE, DELETE).
# Quem cria e altera tabelas é outro usuário, usado só na migração. Menor privilégio:
# se a API for invadida, o invasor não consegue apagar tabelas nem criar usuários no banco.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# HTTPS/TLS: o certificado fica no proxy reverso (Nginx, Caddy ou o da hospedagem), que entrega a
# requisição à API. Com isso ligado, o Spring confia nos cabeçalhos X-Forwarded-* SÓ desse proxy
# para saber o IP real e que a conexão original era HTTPS (o que liga o HSTS).
server.forward-headers-strategy=framework

logging.level.root=WARN
logging.level.SEGURANCA=INFO
