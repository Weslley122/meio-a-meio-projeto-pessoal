# Perfil "mysql": usado quando o back-end é iniciado com
#   mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# O banco "meio_a_meio" é criado automaticamente se não existir.
# Usuário e senha vêm de DB_USER e DB_PASSWORD; sem elas, usa root/root.
spring.datasource.url=jdbc:mysql://localhost:3306/meio_a_meio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
