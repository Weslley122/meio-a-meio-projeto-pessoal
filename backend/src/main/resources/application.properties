# ===== Banco de dados padrão: H2 em arquivo (não precisa instalar nada) =====
# Os dados ficam na pasta ./data deste projeto e continuam lá entre uma execução e outra.
# Para usar MySQL em vez disso, rode com o perfil "mysql" (veja application-mysql.properties e o README).
spring.datasource.url=jdbc:h2:file:./data/meioameio;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Servidor =====
server.port=8080

# ===== JWT =====
# Em produção, defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres para HS256).
# Sem ela, a API sorteia uma chave a cada subida (nada de chave fixa no repositório: ver JwtUtil).
app.jwt.secret=${JWT_SECRET:}
# 12 horas. Token mais curto limita o estrago se ele vazar (não há refresh token neste projeto).
app.jwt.expiration-ms=43200000

# ===== CORS (endereço do front-end React em desenvolvimento) =====
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ===== Segurança =====
# Chave AES-256 (32 bytes em Base64) que cifra o endereço dos clientes no banco.
# Gere outra com:  openssl rand -base64 32   e passe em APP_CRIPTO_CHAVE fora da sua máquina.
app.cripto.chave=${APP_CRIPTO_CHAVE:Qe5trrcKO7cPkSNia6ARFzKXjsZUWJGoCKD598w0zew=}
# Senha do admin criado na primeira execução (telefone 99999999999).
app.admin.senha=${ADMIN_SENHA:admin123}
# Força bruta: senhas erradas seguidas até bloquear o login daquele telefone, e por quanto tempo.
app.seguranca.login.max-falhas=5
app.seguranca.login.bloqueio-minutos=15
# Chamadas por minuto, por IP, às rotas de login e cadastro.
app.seguranca.auth.max-por-minuto=20
# Teto do corpo da requisição (anti-DoS). Qualquer chamada legítima é pequena; 64 KB é folgado.
app.seguranca.max-corpo-bytes=65536
# Erros nunca mostram detalhe técnico para quem chamou a API.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
