# Testes: banco em memória, zerado a cada execução.
spring.datasource.url=jdbc:h2:mem:testes;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=chave-somente-para-os-testes-automatizados-0123456789
app.jwt.expiration-ms=600000
app.cors.allowed-origin=http://localhost:5173
app.cripto.chave=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
app.admin.senha=senha-do-admin-nos-testes
app.seguranca.login.max-falhas=5
app.seguranca.login.bloqueio-minutos=15
# Alto nos testes para o limite por IP não atrapalhar os outros casos (ele tem teste próprio).
app.seguranca.auth.max-por-minuto=1000
