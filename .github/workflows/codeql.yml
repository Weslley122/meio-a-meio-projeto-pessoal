# Análise estática de segurança (SAST) com CodeQL: procura injeção, XSS, segredo no código,
# deserialização insegura etc. Os achados aparecem na aba Security do repositório.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # toda segunda, para pegar regras novas mesmo sem commit

permissions:
  contents: read

jobs:
  analisar:
    name: Analisar (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - linguagem: java-kotlin
            build: none
          - linguagem: javascript-typescript
            build: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.linguagem }}'
